name: Deploy Owner Console to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-stage-owner-console
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pinned commits prevent a mutable action tag from changing underneath us.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build production bundle
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Deploy one Owner Console machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --yes --app stage-owner-console
      - name: Verify public health
        run: curl --fail --silent --show-error --retry 12 --retry-delay 5 https://stage-owner-console.fly.dev/ > /dev/null
